<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRole - Personal Vacancy & Micro-Resume</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="OpenRole - Personal Vacancy & Micro-Resume" />
    <meta property="og:description" content="Create and discover personal vacancies for projects, gaming, fitness, and shared interests." />
    <meta property="og:type" content="website" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #ccfbf1 0%, #f0fdf4 35%, #e0f2fe 70%, #99f6e4 100%);
            background-attachment: fixed;
            color: #0f172a;
            min-height: 100vh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }



        .share-humour-card {
            transform: rotate(-1.25deg);
            transform-origin: center;
            transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(204,251,241,.84), rgba(224,242,254,.88));
            box-shadow: 0 8px 20px rgba(13,148,136,.12), inset 0 1px 0 rgba(255,255,255,.98);
        }
        .share-humour-card.is-straight {
            transform: rotate(0deg);
            box-shadow: 0 10px 24px rgba(13,148,136,.17), inset 0 1px 0 rgba(255,255,255,.98);
        }
        .fun-font {
            font-family: 'Comic Sans MS', 'Trebuchet MS', cursive;
        }

        /* High Intensity Liquid Glass Effects */
        .glass-panel {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 50px -12px rgba(13, 148, 136, 0.22), 
                        0 0 0 1px rgba(255, 255, 255, 0.9) inset,
                        0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 36px -6px rgba(15, 23, 42, 0.08), 
                        inset 0 2px 0 rgba(255, 255, 255, 0.98),
                        0 4px 16px 0 rgba(20, 184, 166, 0.12);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-card:hover {
            border-color: rgba(20, 184, 166, 0.5);
            box-shadow: 0 18px 44px -8px rgba(20, 184, 166, 0.25), inset 0 2px 0 rgba(255, 255, 255, 1);
            transform: translateY(-2px);
        }

        .glass-card:active {
            transform: scale(0.985);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(204, 251, 241, 0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #0d9488;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.25), inset 0 1px 2px rgba(0,0,0,0.02);
            outline: none;
        }

        .glass-pill {
            background: rgba(204, 251, 241, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(153, 246, 228, 0.95);
            color: #0f766e;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-pill:active {
            transform: scale(0.92);
            background: rgba(153, 246, 228, 0.95);
        }

        .chip-selectable {
            cursor: pointer;
            user-select: none;
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chip-selectable.selected {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: white;
            border-color: #0f766e;
            box-shadow: 0 6px 16px rgba(20, 184, 166, 0.35);
        }

        /* Interactive Liquid Buttons */
        .liquid-btn {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .liquid-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(20, 184, 166, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }

        .liquid-btn:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 4px 14px rgba(20, 184, 166, 0.3);
        }

        .touch-bounce {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, opacity 0.2s ease;
        }

        .touch-bounce:active {
            transform: scale(0.94);
        }

        /* Animations */
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-pop-in {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .coin-pop {
            animation: coinPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.88); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes coinPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4) rotate(12deg); }
            100% { transform: scale(1) rotate(0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(13, 148, 136, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="flex flex-col pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-white/80 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2.5 cursor-pointer touch-bounce" onclick="navigateTo('feed')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-500 via-teal-400 to-emerald-300 flex items-center justify-center text-white shadow-lg border border-white/90">
                <span class="text-xl">✨</span>
            </div>
            <div>
                <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-teal-700 via-teal-800 to-emerald-800 bg-clip-text text-transparent">OpenRole</h1>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-5 relative z-10">
        <!-- ================= SECTION 1: FEED & LEADERBOARD ================= -->
        <section id="view-feed" class="space-y-5 animate-fade-in">
            <!-- Leaderboard Section -->
            <div>
                <div class="flex items-center justify-between mb-2.5 px-1">
                    <h3 class="font-bold text-slate-700 text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-trophy text-amber-500"></i> Top Vibe Leaderboard
                    </h3>
                    <span class="text-[10px] text-teal-700 font-semibold">Ranked by 🪙 EXP</span>
                </div>
                <div id="leaderboard-container" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <!-- Dynamic Leaderboard Cards -->
                </div>
            </div>

            <!-- Vacancies Header & Search -->
            <div>
                <div class="flex items-center justify-between mb-2.5 px-1 gap-2">
                    <h3 class="font-bold text-slate-700 text-xs flex items-center gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-sparkles text-teal-600"></i> Open Vacancies
                    </h3>
                    <div class="relative w-full max-w-[200px]">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                        <input type="text" id="search-input" onkeyup="filterResumes()" placeholder="Search vibes, aims..." class="w-full glass-input text-slate-700 text-xs rounded-xl pl-8 pr-3 py-1.5">
                    </div>
                </div>
                
                <div id="feed-container" class="space-y-3.5">
                    <!-- Dynamic Feed Cards -->
                </div>
            </div>
        </section>

        <!-- ================= SECTION 2: SINGLE ROLE VIEW ================= -->
        <section id="view-resume" class="hidden space-y-4 animate-fade-in">
            <div class="flex items-center justify-between">
                <button onclick="navigateTo('feed')" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 bg-white/90 border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm hover:bg-white touch-bounce">
                    <i class="fa-solid fa-arrow-left"></i> Vacancies
                </button>
                <button onclick="shareRoleLink()" class="inline-flex items-center gap-2 text-xs font-semibold text-teal-700 glass-pill px-3.5 py-2 rounded-xl hover:bg-teal-100 shadow-sm touch-bounce">
                    <i class="fa-solid fa-share-nodes"></i> Share Role
                </button>
            </div>

            <article id="single-resume-card" class="glass-card rounded-3xl overflow-hidden relative">
                <!-- Single Resume Content -->
            </article>
        </section>

        <!-- ================= SECTION 3: CREATE PERSONAL ROLE FORM ================= -->
        <section id="view-create" class="hidden animate-fade-in">
            <div class="glass-panel rounded-3xl p-5 sm:p-7 space-y-4 shadow-xl">
                <div class="border-b border-slate-200/80 pb-3">
                    <h2 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-teal-600"></i> Create Your Resume
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">Show employers what you are looking for and what you bring to the role.</p>
                </div>

                <form id="create-resume-form" onsubmit="handleCreateResume(event)" class="space-y-4">
                    
                    <!-- Basic Info Group -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Name / Alias *</label>
                            <input type="text" id="form-name" maxlength="60" required placeholder="e.g. Alex M., Sky, @dev_sam" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Contact Handle *</label>
                            <input type="text" id="form-handle" maxlength="100" required placeholder="e.g. @alex_vibes" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Choose gender *</label>
                        <select id="form-gender" required onchange="renderAvatarChoices()" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                        <p class="text-[10px] text-slate-500 mt-1">Now choose the portrait you want on your resume.</p>
                        <div id="avatar-choices" class="grid grid-cols-3 gap-3 mt-3"></div>
                        <input type="hidden" id="form-avatar" value="male-casual" required>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Role You’re Looking For *</label>
                        <input type="text" id="form-role" maxlength="80" required placeholder="e.g. Frontend Developer, Project Partner, Gaming Teammate" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                    </div>

                    <!-- REQUIREMENT & AIM SELECTION TOOL -->
                    <div class="bg-teal-50/70 p-4 rounded-2xl border border-teal-100 space-y-3">
                        <label class="block text-xs font-extrabold text-teal-900 flex items-center justify-between">
                            <span>🎯 Interested In *</span>
                            <span class="text-[10px] text-teal-600 font-semibold">Tap to toggle</span>
                        </label>
                        <div id="aim-chips-container" class="flex flex-wrap gap-1.5">
                            <!-- Preset Aim Chips -->
                        </div>
                        <div class="flex gap-2 pt-1">
                            <input type="text" id="custom-aim-input" placeholder="Add custom aim..." class="flex-1 glass-input rounded-xl px-3 py-1.5 text-xs text-slate-800">
                            <button type="button" onclick="addCustomAim()" class="px-3 py-1.5 bg-teal-600 text-white rounded-xl text-xs font-bold hover:bg-teal-700 transition-all shadow-xs touch-bounce">
                                + Add
                            </button>
                        </div>
                    </div>

                    <!-- Pitch & Vibe Details -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Resume / About Me *</label>
                        <textarea id="form-bio" required maxlength="500" rows="2" placeholder="Describe your experience, goals, and the kind of opportunity you want..." class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Key Skills / Strengths (optional)</label>
                        <input type="text" id="form-experience" maxlength="180" placeholder="e.g. Communication, design, reliability" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                        <input type="hidden" id="form-skills" value="">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">What You Bring / Preferences (optional)</label>
                        <input type="text" id="form-greenflags" maxlength="220" placeholder="Your strengths, preferences, or ideal work environment" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                        <input type="hidden" id="form-package" value="">
                    </div>

                    <button type="submit" class="w-full py-3 text-white font-bold text-sm rounded-xl liquid-btn mt-3">
                        Publish Resume
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- Clickable creator credit -->
    <a href="https://essential.oneapp.dev" target="_blank" rel="noopener noreferrer"
       aria-label="Created by 4ksh2574 — visit essential.oneapp.dev"
       class="fixed right-3 bottom-[4.8rem] z-40 select-none opacity-80 hover:opacity-100 transition-opacity focus:outline-none focus:ring-2 focus:ring-teal-500 rounded-full">
        <span class="text-[9px] font-bold tracking-wide text-teal-900 bg-white/80 backdrop-blur-sm border border-white/90 rounded-full px-2.5 py-1 shadow-sm hover:shadow-md inline-flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Created by 4ksh2574
        </span>
    </a>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-white/80 px-6 py-2.5 flex justify-around shadow-2xl">
        <button onclick="navigateTo('feed')" id="nav-btn-feed" class="flex flex-col items-center gap-1 text-teal-700 font-bold text-xs touch-bounce">
            <i class="fa-solid fa-shapes text-lg"></i>
            <span class="text-[11px]">Resumes</span>
        </button>
        <button onclick="navigateTo('create')" id="nav-btn-create" class="flex flex-col items-center gap-1 text-slate-500 hover:text-teal-700 font-medium text-xs touch-bounce">
            <i class="fa-solid fa-plus-circle text-lg"></i>
            <span class="text-[11px]">Post Resume</span>
        </button>
    </div>

    <!-- MODAL: Apply / Pitch for Role -->
    <div id="apply-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel rounded-3xl p-6 w-full max-w-md shadow-2xl relative border border-white/80 animate-pop-in">
            <button onclick="closeApplyModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 touch-bounce">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-base font-extrabold text-slate-800 flex items-center gap-2 mb-1">
                <i class="fa-solid fa-paper-plane text-teal-600"></i> Offer This Person a Job
            </h3>

            <form onsubmit="handleProposalSubmit(event)" class="space-y-3 mt-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Employer Name *</label>
                    <input type="text" id="employer-name" maxlength="80" required placeholder="Your full name or professional name" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Username *</label>
                    <input type="text" id="employer-username" maxlength="60" required placeholder="e.g. alex_sharma or @alexsharma" class="w-full glass-input rounded-xl px-3.5 py-2 text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Contac
